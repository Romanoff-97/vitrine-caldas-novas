<header class="bg-emerald-600 text-white p-6 md:p-8 rounded-b-3xl shadow-md">
  <div class="flex items-center justify-between">
    <a routerLink="/admin" aria-label="Acessar Painel Administrativo" title="Painel Administrativo"
      class="p-2 bg-emerald-700/80 hover:bg-emerald-800 rounded-xl text-white transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-white">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
    </a>
    <h1 class="text-2xl md:text-3xl font-bold text-center">Vitrine<br class="md:hidden"> Caldas Novas</h1>
    <a routerLink="/admin/feira/nova" aria-label="Cadastrar nova feira" title="Cadastrar nova feira"
      class="p-2 bg-emerald-700 hover:bg-emerald-800 rounded-xl text-white transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-white">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
    </a>
  </div>
  <p class="text-emerald-100 text-center text-sm md:text-base mt-2">Apoie o comércio local</p>
</header>

<section class="flex-1 p-6 md:p-8 overflow-y-auto no-scrollbar">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg md:text-xl font-bold text-gray-800">Escolha uma feira:</h2>
  </div>

  <nav class="flex flex-col gap-4" aria-label="Navegação das Feiras">

    @if (loading) {
    <p class="text-gray-500 text-center py-6">Carregando feiras...</p>
    } @else {
    @for (feira of feiras; track $index) {
    <div class="relative group">
      <a [routerLink]="['/feira', feira._id]"
        class="w-full text-left bg-white border-2 border-gray-100 p-4 md:p-5 rounded-2xl shadow-sm hover:border-emerald-500 hover:shadow-md transition-all block">
        <div class="flex items-start justify-between gap-2">
          <h3 class="font-bold text-gray-800 text-xl md:text-2xl group-hover:text-emerald-600 transition-colors">{{
            feira.nome }}</h3>
          <a [routerLink]="['/admin/feira', feira._id, 'editar']" (click)="$event.stopPropagation()"
            aria-label="Editar feira" title="Editar feira"
            class="p-1.5 text-gray-400 hover:text-slate-900 rounded-lg hover:bg-gray-100 transition-colors shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z">
              </path>
            </svg>
          </a>
        </div>
        <p class="text-gray-500 text-sm md:text-base mt-1" aria-label="Dias de funcionamento">
          {{ formatarDias(feira.diasFuncionamento) }} • {{ feira.localizacao }}
        </p>
      </a>
    </div>
    } @empty {
    <p class="text-gray-500 text-center py-6">Nenhuma feira encontrada.</p>
    }
    }
  </nav>
</section>
