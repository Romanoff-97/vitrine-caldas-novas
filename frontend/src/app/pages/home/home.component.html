<main class="bg-gray-100 min-h-screen p-4 md:p-8 flex justify-center items-center">
  <div
    class="w-full max-w-[375px] md:max-w-xl lg:max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col my-auto transition-all">
    <header class="bg-emerald-600 text-white p-6 md:p-8 rounded-b-3xl shadow-md">
      <h1 class="text-2xl md:text-3xl font-bold text-center mt-2">Vitrine<br class="md:hidden"> Caldas Novas</h1>
      <p class="text-emerald-100 text-center text-sm md:text-base mt-2">Apoie o comércio local</p>
    </header>

    <section class="flex-1 p-6 md:p-8 overflow-y-auto no-scrollbar">
      <h2 class="text-lg md:text-xl font-bold text-gray-800 mb-4">Escolha uma feira:</h2>

      <nav class="flex flex-col gap-4" aria-label="Navegação das Feiras">

        <!-- Angular 18: Novo Control Flow -->
        @if (loading) {
        <p class="text-gray-500 text-center py-6">Carregando feiras...</p>
        } @else {
        @for (feira of feiras; track $index) {
        <a [routerLink]="['/feira', feira._id]"
          class="w-full text-left bg-white border-2 border-gray-100 p-4 md:p-5 rounded-2xl shadow-sm hover:border-emerald-500 hover:shadow-md transition-all group block">
          <h3 class="font-bold text-gray-800 text-xl md:text-2xl group-hover:text-emerald-600">{{ feira.nome }}</h3>
          <p class="text-gray-500 text-sm md:text-base mt-1" aria-label="Dias de funcionamento">
            {{ formatarDias(feira.diasFuncionamento) }} • {{ feira.localizacao }}
          </p>
        </a>
        } @empty {
        <p class="text-gray-500 text-center py-6">Nenhuma feira encontrada.</p>
        }
        }
      </nav>
    </section>
  </div>
</main>
