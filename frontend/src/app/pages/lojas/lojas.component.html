<header class="bg-emerald-600 text-white p-4 md:p-6 shadow-md flex flex-col gap-4">
  <div class="flex items-center gap-3">
    <a routerLink="/" aria-label="Voltar para a página inicial"
      class="p-2 bg-emerald-700 rounded-full hover:bg-emerald-800 transition-colors">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
        </path>
      </svg>
    </a>
    <h1 class="text-xl md:text-2xl font-bold">Lojas da Feira</h1>
  </div>

  <!-- Barra de Busca (RF06) -->
  <div class="relative">
    <input type="search" aria-label="Buscar lojas ou produtos" placeholder="Buscar lojas ou produtos..."
      (keyup)="filtrarLojas($event)"
      class="w-full py-3 px-4 rounded-xl text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-300">
    <svg class="w-5 h-5 absolute right-4 top-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
    </svg>
  </div>
</header>

<section class="bg-gray-50 flex-1 p-4 md:p-6 overflow-y-auto no-scrollbar flex flex-col gap-4">
  @if (loading) {
  <p class="text-gray-500 text-center py-6">Carregando lojas...</p>
  } @else {
  @for (loja of lojasFiltradas; track $index) {
  <article
    class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-3 hover:shadow-md transition-shadow">
    <div class="flex gap-4 items-center">
      <div
        class="w-14 h-14 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center text-2xl font-bold"
        aria-hidden="true">
        🛍️
      </div>
      <div>
        <h3 class="font-bold text-gray-800 text-lg">{{ loja.nome }}</h3>
        <p class="text-sm text-gray-500">{{ loja.categoria }}</p>
      </div>
    </div>
    <p class="text-sm text-gray-600 line-clamp-2" [title]="loja.descricao">{{ loja.descricao }}</p>

    <button (click)="abrirWhatsApp(loja.whatsapp, loja.nome)" [attr.aria-label]="'Falar no WhatsApp com ' + loja.nome"
      class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-colors mt-2">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.125-.339-.154-.837-.365-1.503-.981-1.325-1.229-2.158-2.617-2.222-2.704-.064-.087-.528-.703-.528-1.341 0-.638.331-.955.452-1.085.121-.131.261-.164.348-.164.087 0 .174 0 .248.003.078.003.178-.031.278.21.109.261.371.905.405.975.034.07.056.151.013.238-.044.087-.065.141-.131.217-.065.076-.137.164-.196.226-.065.071-.134.148-.052.288.082.141.365.603.778.972.533.475 1.002.628 1.144.698.141.07.226.059.309-.036.082-.095.356-.411.452-.553.095-.141.191-.118.318-.071.126.047.801.376.938.445.137.07.228.105.261.164.033.059.033.344-.111.749z" />
      </svg>
      Falar no WhatsApp
    </button>
  </article>
  } @empty {
  <p class="text-gray-500 text-center py-6" aria-live="polite">Nenhuma loja encontrada.</p>
  }
  }
</section>
